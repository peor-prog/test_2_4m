<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Доска объявлений{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'ad_list' %}">Доска объявлений</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="{% url 'ad_list' %}">Главная</a>
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'my_ads' %}">Мои объявления</a>
                <a class="nav-link" href="{% url 'ad_create' %}">Создать</a>
            {% endif %}
        </div>
        <div class="navbar-nav align-items-center">
            {% if user.is_authenticated %}
                <span class="navbar-text text-white me-3">Привет, {{ user.username }}!</span>
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                </form>
            {% else %}
                <a class="nav-link" href="{% url 'login' %}">Войти</a>
                <a class="nav-link" href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
