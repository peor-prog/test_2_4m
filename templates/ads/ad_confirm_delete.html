{% extends 'base.html' %}

{% block title %}Удаление объявления{% endblock %}

{% block content %}
<div class="alert alert-danger">
    <h4>Вы уверены, что хотите удалить объявление «{{ ad.title }}»?</h4>
    <p>Это действие нельзя отменить.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'ad_detail' ad.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
